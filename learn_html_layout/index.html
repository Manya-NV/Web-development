<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>learn css</title>
    <link rel="stylesheet" href="./css/style.css"/>
</head>
<body class="main header">
    <h1>css layout using flexbox grid </h1>
    <h1 class="main-header">flex layout</h1>
    <div class="flex-layout">
    <div class="box1">
        <h1>box1</h1>
        <p>Lorem ipsum dolor sit amet.</p>
    </div>

    <div class="box2">
        <h1>box2</h1>
        <p>Lorem ipsum dolor sit amet consectetur.</p>
    </div>

    <div class="box3">
        <h1>box3</h1>
    </div>

    <div class="box4">
        <h1>box4</h1>
    </div>
</div>
    <h1 class="main-header">grid layout</h1>
    <div class="grid-layout">
    <div class="grid-item">
        <h1>item1</h1>
    </div>

    <div class="grid-item">
        <h1>item2</h1>
    </div>

    <div class="grid-item">
        <h1>item3</h1>
    </div>

    <div class="grid-item">
        <h1>item4</h1>
    </div>
</div>
</html>
